[package]
name = "hashline-rs"
version = "0.1.0"
edition = "2024"
rust-version = "1.99"
description = "Standalone MCP server for hashline anchor-based file reading, editing, and searching"
license = "Apache-2.0"
repository = "https://github.com/zchee/hashline-rs"
keywords = ["mcp", "hashline", "editing", "anchors"]
categories = ["development-tools"]

[[bin]]
name = "hashline-mcp"
path = "src/main.rs"

[lib]
name = "hashline"
path = "src/lib.rs"

[features]
default = ["gxhash"]
# Link `gxhash` and use it for the line hash wherever the target actually has
# AES intrinsics. Optional because `gxhash` itself refuses to compile without
# them: a consumer whose build does not enable `+aes` (see .cargo/config.toml
# and src/hash.rs) turns this off and gets the portable FNV-1a line hash.
gxhash = ["dep:gxhash"]

[dependencies]
anyhow = "1"
clap = { version = "4", features = ["derive", "env"] }
grep-matcher = "0.1"
grep-regex = "0.1"
grep-searcher = "0.1"
# Direct use for the glob tool's path matching; already transitive via ignore,
# so this pins no new code into the build.
globset = "0.4"
# Line hash on targets with AES intrinsics; see src/hash.rs and
# .cargo/config.toml. Gated behind the `gxhash` feature (on by default) because
# the crate emits a `compile_error!` on any build without `+aes`, so a build
# that cannot supply the flag must be able to drop the dependency outright.
gxhash = { version = "3.5.0", optional = true }
ignore = "0.4"
itoa = "1"
memchr = "2"
percent-encoding = "2"
rmcp = { version = "3.0.1", features = ["server", "macros", "transport-io"] }
schemars = "1.1"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
simdutf8 = "0.1"
thiserror = "2"
# Portable, process-seeded 128-bit identities for exact v2 snapshot bytes.
xxhash-rust = { version = "0.8", features = ["xxh3"] }
tokio = { version = "1", features = ["fs", "io-std", "macros", "rt-multi-thread"] }
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }

[dev-dependencies]
criterion = { version = "0.8.2", features = ["async_tokio", "html_reports"] }
blake3 = "1"
libc = "0.2"
# Runner-up of the Phase 6 bench-off, kept so the `hash_matrix` group can keep
# measuring the shipped choice against it. Not used by the crate itself.
rapidhash = "4.5.1"
# Independent engine for the grep differential test's per-line reference
# implementation; the production path matches via grep-regex/grep-searcher.
regex = "1"
tempfile = "3"
# The stdio E2E test (tests/e2e_stdio.rs) drives the real binary as a child
# process; these features are additive on top of the runtime features above.
tokio = { version = "1", features = ["io-util", "process", "time"] }

[[bench]]
name = "hashline"
harness = false

[[bench]]
name = "phase0-resources"
path = "benches/support/phase0_resources.rs"
harness = false

[profile.release]
lto = "fat"
codegen-units = 1
strip = "symbols"
