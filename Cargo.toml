[package]
name = "hashline-rs"
version = "0.1.0"
edition = "2024"
rust-version = "1.88"
description = "Standalone MCP server for hashline anchor-based file reading, editing, and searching"
license = "Apache-2.0"
repository = "https://github.com/zchee/hashline-rs"
keywords = ["mcp", "hashline", "editing", "anchors"]
categories = ["development-tools"]

[[bin]]
name = "hashline-mcp"
path = "src/main.rs"

[lib]
name = "hashline"
path = "src/lib.rs"

[dependencies]
anyhow = "1"
clap = { version = "4", features = ["derive", "env"] }
grep-matcher = "0.1"
grep-regex = "0.1"
grep-searcher = "0.1"
# Line hash on targets with AES intrinsics; see src/hash.rs and
# .cargo/config.toml. Other targets fall back to the fused FNV-1a pass and
# never link it in.
gxhash = "3.5.0"
ignore = "0.4"
itoa = "1"
memchr = "2"
percent-encoding = "2"
rmcp = { version = "3.0.1", features = ["server", "macros", "transport-io"] }
schemars = "1.1"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
simdutf8 = "0.1"
thiserror = "2"
tokio = { version = "1", features = ["fs", "io-std", "macros", "rt-multi-thread"] }
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }

[dev-dependencies]
criterion = { version = "0.8.2", features = ["async_tokio", "html_reports"] }
# Runner-up of the Phase 6 bench-off, kept so the `hash_matrix` group can keep
# measuring the shipped choice against it. Not used by the crate itself.
rapidhash = "4.5.1"
# Independent engine for the grep differential test's per-line reference
# implementation; the production path matches via grep-regex/grep-searcher.
regex = "1"
tempfile = "3"

[[bench]]
name = "hashline"
harness = false

[profile.release]
lto = "fat"
codegen-units = 1
strip = "symbols"
