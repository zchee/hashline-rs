name: CI

on:
  push:
    branches: [main]
  pull_request:

env:
  CARGO_TERM_COLOR: always

jobs:
  gates:
    name: Gates (macOS)
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4
      - name: Install the pinned toolchain
        run: rustup show active-toolchain || rustup toolchain install
      - uses: Swatinem/rust-cache@v2
      - name: Test
        run: cargo test
      - name: Clippy
        run: cargo clippy --all-targets -- -D warnings
      - name: Format
        run: cargo fmt --check
      - name: Benches compile
        run: cargo bench --no-run

  gates-linux:
    name: Gates (Linux, advisory)
    runs-on: ubuntu-latest
    # Advisory only: the FileStamp-granularity tests are flaky on Linux
    # filesystems (a same-length rewrite inside one timestamp tick evades the
    # stamp check) — a pre-existing issue that predates this workflow and is
    # tracked separately. Everything else must stay green here too.
    continue-on-error: true
    steps:
      - uses: actions/checkout@v4
      - name: Install the pinned toolchain
        run: rustup show active-toolchain || rustup toolchain install
      - uses: Swatinem/rust-cache@v2
      - name: Test
        run: cargo test
      - name: Clippy
        run: cargo clippy --all-targets -- -D warnings
