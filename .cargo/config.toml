# AES intrinsics for the gxhash line hash (src/hash.rs).
#
# `gxhash` refuses to compile without AES, and only one common target enables
# it by default:
#
#   aarch64-apple-darwin      aes + neon baseline -> no entry needed
#   aarch64-unknown-linux-gnu neon only           -> needs +aes
#   aarch64-linux-android     neon only           -> needs +aes
#   aarch64-pc-windows-msvc   neon only           -> needs +aes
#   x86_64-*                  sse2 only           -> needs +aes
#
# These flags are part of the product's build configuration, applied identically
# to release builds and to `cargo bench`, so benchmark configuration matches ship
# configuration and comparisons stay apples-to-apples. That is also why this is a
# committed file rather than ambient `RUSTFLAGS`.
#
# Which line hash a build ends up with:
#
#   default features + a target that has AES (an entry here, or a baseline that
#     already includes it)                                  -> gxhash32
#   `--no-default-features`, or a target with neither        -> fused FNV-1a
#
# The fallback is slower and produces different anchor letters, never wrong
# ones: both paths hash the same normalized bytes, and anchors are ephemeral
# per session, so a per-build divergence is invisible to callers.
#
# Two ways to lose the `+aes` here, both of which need
# `--no-default-features` to build at all, because `gxhash` fails compilation
# rather than degrading:
#
#   * Any ambient `RUSTFLAGS` value REPLACES `target.<triple>.rustflags`
#     wholesale — cargo does not merge them — so setting it for an unrelated
#     reason silently drops `+aes`.
#   * Cargo discovers `.cargo/config.toml` from the invocation's working
#     directory, so a crate that depends on hashline-rs never sees this file.
#     Such a consumer supplies `+aes` itself or turns the feature off.
#
# Enabling `+aes` means the resulting binary uses AES instructions
# unconditionally, which faults on a CPU that lacks them (pre-2010 x86_64
# without AES-NI; aarch64 without the optional crypto extension). `main()`
# checks for the extension at startup and exits with a clear message rather
# than taking SIGILL mid-request.

[target.x86_64-unknown-linux-gnu]
rustflags = ["-C", "target-feature=+aes"]

[target.x86_64-unknown-linux-musl]
rustflags = ["-C", "target-feature=+aes"]

[target.x86_64-apple-darwin]
rustflags = ["-C", "target-feature=+aes"]

[target.x86_64-pc-windows-msvc]
rustflags = ["-C", "target-feature=+aes"]

[target.aarch64-unknown-linux-gnu]
rustflags = ["-C", "target-feature=+aes"]

[target.aarch64-unknown-linux-musl]
rustflags = ["-C", "target-feature=+aes"]

[target.aarch64-linux-android]
rustflags = ["-C", "target-feature=+aes"]

[target.aarch64-pc-windows-msvc]
rustflags = ["-C", "target-feature=+aes"]
